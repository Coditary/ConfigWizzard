name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout configwizard-core (sibling)
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository_owner }}/configwizard-core.git" ../configwizard-core
      - uses: dtolnay/rust-toolchain@stable
      - name: CLI tests
        run: cargo test

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout dependencies (siblings)
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository_owner }}/configwizard-core.git" ../configwizard-core
          git clone --depth 1 "https://github.com/${{ github.repository_owner }}/Tuinator.git" ../Tuinator
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build and test TUI
        run: make tui-test
        env:
          TUINATOR_ROOT: ${{ github.workspace }}/../Tuinator
