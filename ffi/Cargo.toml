[package]
name = "configwizard-ffi"
description = "C FFI bridge from ConfigWizard core to the Tuinator TUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "configwizard_ffi"
crate-type = ["staticlib"]

[dependencies]
configwizard-core = { path = "../../configwizard-core" }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
